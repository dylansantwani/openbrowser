<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenBrowser — accessibility tree tests</title>
    <!-- The same stylesheet the extension injects in production, so the marks
         overlay is positioned here exactly as it is on a real page. -->
    <link rel="stylesheet" href="../extension/content/overlay.css" />
    <style>
      body { font: 13px ui-monospace, monospace; margin: 0; display: flex; height: 100vh; }
      #fixture { width: 40%; padding: 16px; overflow: auto; border-right: 1px solid #ccc; font-family: system-ui, sans-serif; }
      #results { width: 60%; padding: 16px; overflow: auto; background: #fbfbfc; }
      .pass { color: #15803d; }
      .fail { color: #b91c1c; font-weight: 600; }
      pre { background: #fff; border: 1px solid #e3e6ea; padding: 10px; white-space: pre-wrap; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <!--
      Fixture: a deliberately awkward page. Every construct here is one that
      naive accessibility-tree extraction gets wrong, and each is asserted below.
    -->
    <div id="fixture">
      <header>
        <nav aria-label="Main">
          <a href="/">Home</a>
          <a href="/pricing">Pricing</a>
        </nav>
      </header>

      <main>
        <h1>Create your account</h1>

        <!-- Wrapper soup: five nested divs carrying no meaning. -->
        <div><div><div class="card"><div class="card-body"><div>
          <form id="signup">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required />

            <!-- Label association by wrapping, not `for`. -->
            <label>Password
              <input name="password" type="password" />
            </label>

            <!-- Name only from placeholder. -->
            <input name="coupon" type="text" placeholder="Coupon code" />

            <select name="plan">
              <option value="free">Free</option>
              <option value="pro" selected>Pro — $20/mo</option>
            </select>

            <label><input type="checkbox" name="tos" /> I accept the terms</label>
            <label><input type="radio" name="billing" value="monthly" checked /> Monthly</label>
            <label><input type="radio" name="billing" value="yearly" /> Yearly</label>

            <button type="submit">Create account</button>
            <button type="button" disabled>Invite team</button>
          </form>
        </div></div></div></div></div>

        <!-- A div acting as a button. Extremely common, no ARIA at all. -->
        <div class="btn" onclick="void 0" style="cursor:pointer;width:120px;height:32px">Skip for now</div>

        <!-- Icon-only control named solely by aria-label. -->
        <button aria-label="Dismiss notification">&times;</button>

        <!-- States that must be reported. -->
        <button aria-expanded="false" aria-controls="adv">Advanced options</button>
        <div id="adv" hidden><input name="hidden-field" /></div>

        <input type="hidden" name="csrf" value="abc123" />
        <div style="display:none"><button>Never rendered</button></div>
        <div aria-hidden="true"><button>Hidden from a11y</button></div>

        <!--
          Our own overlays. The window prompt is the one that matters: it asks
          the human which window an agent may work in, so an agent that could
          see its buttons in a snapshot could click "Use this window" itself.
        -->
        <div class="ob-agent-frame" data-ob-agent="OpenBrowser · test"></div>
        <div class="ob-window-pick" role="dialog">
          <div class="ob-window-pick-card">
            <div class="ob-window-pick-title">claude · test wants to work in this window</div>
            <button class="ob-window-pick-btn ob-window-pick-yes">Use this window</button>
            <button class="ob-window-pick-btn">Not this one</button>
          </div>
        </div>

        <!-- Screen-reader-only text is a real control, not noise. -->
        <a href="/skip" class="visually-hidden">Skip to content</a>

        <!--
          Patterns found on real sites (Wikipedia), each of which broke an
          earlier version of the extractor.
        -->

        <!-- Logo link: decorative icon first, meaningful wordmark second. The
             name must come from the wordmark, not the empty alt. -->
        <a href="/home" id="logo-link">
          <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" aria-hidden="true" width="20" height="20" />
          <span class="wordmark"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Acme Corp" width="60" height="20" /></span>
        </a>

        <!-- `cursor: pointer` inherits, so this span looks clickable but is not
             separately actionable. It must not get its own ref. -->
        <a href="/deals" style="cursor:pointer"><span class="inner" style="cursor:pointer">Today's deals</span></a>

        <!-- Tracking parameters must be elided, short meaningful ones kept. -->
        <a href="/donate?wmf_source=sidebar&wmf_medium=nav&wmf_campaign=en.wikipedia.org&utm_content=xyz">Donate</a>
        <a href="/search?q=laptop">Search laptops</a>

        <!-- `display: contents` generates no box, so checkVisibility() reports
             it invisible — but its children render normally. React apps wrap
             whole subtrees in these; dropping them loses most of the page. -->
        <span style="display: contents">
          <span style="display: contents">
            <button id="contents-btn">Buried under display:contents</button>
          </span>
        </span>

        <!-- Web component with an open shadow root. -->
        <my-widget></my-widget>

        <p>Some body copy that only appears in full mode.</p>
      </main>

      <footer><a href="https://example.org/privacy">Privacy policy</a></footer>
    </div>

    <div id="results">running…</div>

    <script>
      // Shadow DOM fixture — controls inside must still be found.
      customElements.define(
        'my-widget',
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: 'open' });
            root.innerHTML =
              '<button id="shadow-btn">Inside shadow DOM</button>' +
              '<input id="shadow-input" placeholder="Shadow field" />';
          }
        }
      );
    </script>

    <!-- Screenshot-by-selector fixture: a wide chart mid-page, plus a tiny decoy
         svg, so the "largest visible match wins" rule is actually exercised. -->
    <div id="shotfix" style="position:absolute;left:-9999px;top:0">
      <svg id="decoy" width="16" height="16"><rect width="16" height="16"/></svg>
      <svg id="chart" width="820" height="460"><rect width="820" height="460"/></svg>
      <img id="pic" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
           style="width:300px;height:200px" alt="" />
      <svg id="hiddensvg" width="900" height="900" style="display:none"></svg>
    </div>

    <script>
      // Shim just enough chrome for the content scripts to load in a bare page:
      // main.js registers a runtime listener at load, format.js a tabs one.
      window.chrome = {
        runtime: { onMessage: { addListener() {} } },
        tabs: { onRemoved: { addListener() {} } },
      };
    </script>
    <script src="../extension/content/a11y.js"></script>
    <script src="../extension/content/actions.js"></script>
    <script src="../extension/content/main.js"></script>

    <script type="module">
      const fmt = await import('../extension/background/format.js');

      const out = [];
      let pass = 0;
      let fail = 0;

      function check(name, condition, detail = '') {
        if (condition) { pass++; out.push(`<div class="pass">ok   ${name}</div>`); }
        else { fail++; out.push(`<div class="fail">FAIL ${name}${detail ? ` — ${escapeHtml(detail)}` : ''}</div>`); }
      }
      const escapeHtml = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

      // Scope to the fixture so the results pane cannot pollute the tree.
      const { nodes } = OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      const rendered = fmt.renderTree(nodes);
      const text = rendered.text;

      // --- Structure ---------------------------------------------------------
      check('emits a tree', nodes.length > 0);
      check('collapses wrapper divs', !/^\s*generic\s*$/m.test(text));
      check('keeps landmarks', /navigation/.test(text) && /form/.test(text));
      check('keeps heading with level', /heading "Create your account" h1/.test(text));

      // --- Naming ------------------------------------------------------------
      check('name from <label for>', /textbox "Email address"/.test(text));
      check('name from wrapping label', /password "Password"/.test(text));
      check('name from placeholder', /textbox "Coupon code"/.test(text));
      check('name from aria-label', /button "Dismiss notification"/.test(text));
      check('link name from text', /link "Home"/.test(text));

      // --- Roles -------------------------------------------------------------
      check('password input gets its own role', /password "Password"/.test(text));
      check('select becomes combobox', /combobox/.test(text));
      check('div with onclick + pointer becomes a button', /button "Skip for now"/.test(text));

      // --- State -------------------------------------------------------------
      check('required is reported', /textbox "Email address" \[e\d+\] required/.test(text));
      check('disabled is reported', /button "Invite team" \[e\d+\] disabled/.test(text));
      check('unchecked checkbox is reported', /checkbox "I accept the terms" \[e\d+\] unchecked/.test(text));
      check('checked radio is reported', /radio "Monthly" \[e\d+\] checked/.test(text));
      check('aria-expanded is reported', /button "Advanced options" \[e\d+\] collapsed/.test(text));
      check('selected option value is shown', /combobox .*=.*Pro/.test(text));

      // --- Visibility --------------------------------------------------------
      check('hidden input excluded', !/csrf/.test(text));
      check('display:none excluded', !/Never rendered/.test(text));
      check('aria-hidden excluded', !/Hidden from a11y/.test(text));
      check('[hidden] container excluded', !/hidden-field/.test(text));
      check('visually-hidden link included', /link "Skip to content"/.test(text));

      // Our own overlays never enter the tree we report. For the window prompt
      // that is not tidiness — it is the only thing stopping an agent from
      // answering a question the human was asked about it.
      check('the window prompt is invisible to a snapshot',
        !/Use this window/.test(text) && !/Not this one/.test(text));
      check('the agent frame is invisible to a snapshot', !/OpenBrowser · test/.test(text));

      // --- Real-site regressions ---------------------------------------------
      // Each of these was found by running against Wikipedia, not by design.
      check('logo name skips the decorative alt=""', /link "Acme Corp"/.test(text), firstLineMatching(/\/home/));
      check('decorative image is not emitted', !/img ""/.test(text) && !/^\s*img\s*$/m.test(text));
      check('span inside a link gets no ref of its own',
        !/generic .*\[e\d+\]/.test(text) && /link "Today's deals"/.test(text));
      check('tracking query is elided', /\/donate\?…/.test(text), firstLineMatching(/donate/));
      check('short meaningful query is kept', /\/search\?q=laptop/.test(text));
      check('no href exceeds 72 chars',
        [...text.matchAll(/\[e\d+\] (\S+)/g)].every((m) => m[1].length <= 72));

      function firstLineMatching(re) {
        return text.split('\n').find((l) => re.test(l)) || '(no matching line)';
      }

      check('display:contents wrappers do not hide their children',
        /button "Buried under display:contents"/.test(text), firstLineMatching(/Buried/));

      // --- Shadow DOM --------------------------------------------------------
      check('pierces open shadow root (button)', /button "Inside shadow DOM"/.test(text));
      check('pierces open shadow root (input)', /textbox "Shadow field"/.test(text));

      // --- Links -------------------------------------------------------------
      check('same-origin href shown as a path', /link "Pricing" \[e\d+\] \/pricing/.test(text));
      check('cross-origin href shown in full', /example\.org\/privacy/.test(text));

      // --- Modes -------------------------------------------------------------
      const full = fmt.renderTree(OB.a11y.buildTree({ mode: 'full', selector: '#fixture' }).nodes).text;
      check('full mode adds body copy', /only appears in full mode/.test(full));
      check('interactive mode omits body copy', !/only appears in full mode/.test(text));
      check('full mode is larger than interactive', full.length > text.length);

      // --- Refs --------------------------------------------------------------
      const refs = [...text.matchAll(/\[(e\d+)\]/g)].map((m) => m[1]);
      check('refs are assigned', refs.length >= 12, `got ${refs.length}`);
      check('refs are unique', new Set(refs).size === refs.length);
      check('refs resolve to live elements', refs.every((r) => OB.a11y.resolveRef(r)?.isConnected));

      // Ref stability is what makes mode:"diff" and multi-step plans work.
      const before = new Map(refs.map((r) => [r, OB.a11y.resolveRef(r)]));
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      check('refs are stable across snapshots', [...before].every(([r, el]) => OB.a11y.resolveRef(r) === el));

      // --- Set-of-Marks ------------------------------------------------------
      // Every badge must stand for a real, resolvable element with a live box in
      // top-level viewport coordinates — a mark that resolves to nothing is a
      // click into the void, the exact failure the feature removes. viewportOnly
      // is off so the assertion does not depend on how the fixture happens to
      // scroll in the harness window.
      const marked = OB.__handlers.markBoxes({ viewportOnly: false });
      check('markBoxes finds the clickable elements', marked.marks.length >= 12, `got ${marked.marks.length}`);
      check('every mark carries a resolvable ref', marked.marks.every((m) => OB.a11y.resolveRef(m.ref)?.isConnected));
      check('every mark has a real box', marked.marks.every((m) => m.box.w > 0 && m.box.h > 0));
      check('every mark has a label', marked.marks.every((m) => typeof m.label === 'string' && m.label.length > 0));
      check('mark refs are unique', new Set(marked.marks.map((m) => m.ref)).size === marked.marks.length);

      // The badges are painted, countable, and — being in OWN_DECORATION —
      // invisible to the very snapshot they are meant to help a model act on.
      const numbered = marked.marks.slice(0, 5).map((m, i) => ({ n: i + 1, ...m }));
      OB.__handlers.drawMarks({ marks: numbered });
      const badgeEls = [...document.querySelectorAll('.ob-mark')];
      check('drawMarks paints one badge per mark', badgeEls.length === numbered.length);
      // With the production stylesheet loaded the badge is position:fixed and
      // lands on its element's top-left corner — the whole point, and the thing
      // that silently broke without the CSS present. Allow the deliberate few-px
      // nudge that lifts the number just over the corner.
      check('badges are positioned, not stacked', badgeEls.every((b) => getComputedStyle(b).position === 'fixed'));
      check(
        'each badge sits on its element',
        numbered.every((m) => {
          const b = badgeEls.find((el) => el.textContent === String(m.n));
          const r = b.getBoundingClientRect();
          return Math.abs(r.left - m.box.x) <= 6 && Math.abs(r.top - m.box.y) <= 6;
        })
      );
      const withBadges = fmt.renderTree(OB.a11y.buildTree({ mode: 'full', selector: '#fixture' }).nodes).text;
      check('badges never enter the tree the model reads', !/ob-mark/.test(withBadges));
      OB.__handlers.clearMarks();
      check('clearMarks removes every badge', document.querySelectorAll('.ob-mark, .ob-mark-layer').length === 0);

      // --- Mutation counting -------------------------------------------------
      // The settling signal reads this counter to tell "the app has not reacted
      // yet" from "the click went nowhere". Our own highlight box appends and
      // removes itself around every action, so counting it made a dead button
      // report that the page was still changing — the tool drowning out its own
      // signal.
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' }); // start the observer

      // Other installed extensions inject their own UI into every page — a real
      // profile showed `#SASContainer` and `#ibotta-extension-root` both doing
      // it, jQuery-UI handles and all — and that churn is page activity as far
      // as the counter is concerned. It arrives in a burst shortly after load,
      // so measuring without waiting for quiet made this assertion depend on
      // which extensions the machine happened to have (seen failing 0 -> 4 and
      // 0 -> 1 on the same box). Wait for the page to stop moving, so the only
      // thing changing during the measurement is the thing under test.
      async function quiesce(quietFor = 250, timeout = 4000) {
        const startedAt = performance.now();
        let last = OB.a11y.mutationCount();
        let stableSince = performance.now();
        while (performance.now() - startedAt < timeout) {
          await new Promise((r) => setTimeout(r, 50));
          const now = OB.a11y.mutationCount();
          if (now !== last) { last = now; stableSince = performance.now(); }
          else if (performance.now() - stableSince >= quietFor) return true;
        }
        return false;
      }
      await quiesce();

      const mutationsBefore = OB.a11y.mutationCount();

      OB.actions.highlight(document.getElementById('email'), 'click');
      await new Promise((r) => setTimeout(r, 60));
      check('our own highlight box does not count as page activity',
        OB.a11y.mutationCount() === mutationsBefore,
        `${mutationsBefore} -> ${OB.a11y.mutationCount()}`);

      const realChange = document.createElement('p');
      realChange.textContent = 'the page actually did something';
      document.querySelector('#fixture main').appendChild(realChange);
      await new Promise((r) => setTimeout(r, 60));
      check('a real DOM change does count',
        OB.a11y.mutationCount() > mutationsBefore,
        `${mutationsBefore} -> ${OB.a11y.mutationCount()}`);
      realChange.remove();

      // A read drains the observer's queue with `takeRecords`, which *removes*
      // the records — so a change that lands just before a snapshot used to be
      // counted zero times while the identical change with no read in between
      // counted once. Snapshots are the common path, so this quietly erased the
      // evidence that a click had worked.
      await quiesce();
      const beforeDrain = OB.a11y.mutationCount();
      const raced = document.createElement('p');
      raced.textContent = 'changed just before a read';
      document.querySelector('#fixture main').appendChild(raced);
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' }); // drains the queue
      await new Promise((r) => setTimeout(r, 60));
      check('a change that raced a read is still counted',
        OB.a11y.mutationCount() > beforeDrain,
        `${beforeDrain} -> ${OB.a11y.mutationCount()}`);
      raced.remove();

      // --- Scoping to a single element ---------------------------------------
      // Scoping used to walk only the root's children, so pointing a selector
      // at one control returned nothing — indistinguishable from "not on the
      // page", which is the opposite of the truth.
      const scopedToControl = OB.a11y.buildTree({ mode: 'interactive', selector: '#signup button[type=submit]' });
      check('scoping to a single control returns that control',
        scopedToControl.nodes.length === 1 && scopedToControl.nodes[0].name === 'Create account',
        JSON.stringify(scopedToControl.nodes.map((n) => n.name)));

      // Scoping to a container must be unchanged: a wrapper with no role still
      // splices its children in place of itself rather than adding a level.
      const scopedToForm = OB.a11y.buildTree({ mode: 'interactive', selector: '#signup' });
      check('scoping to a container still returns its contents',
        scopedToForm.nodes.length > 5,
        `${scopedToForm.nodes.length} nodes`);

      // --- Waiting for text --------------------------------------------------
      // browser_wait must agree with what browser_find shows. Snapshot names
      // come from aria-label/title/alt/placeholder as often as from text nodes,
      // and a wait that cannot see those times out on a string the tool just
      // displayed — 40 seconds of dead waiting in one real checkout run.
      check('textPresent finds rendered text', OB.actions.textPresent('Create your account'));
      check('textPresent finds a placeholder-named control', OB.actions.textPresent('Coupon code'));

      const iconButton = document.createElement('button');
      iconButton.title = 'Add to Cart';
      iconButton.textContent = '';
      document.querySelector('#fixture main').appendChild(iconButton);
      check('textPresent finds a title-named icon button', OB.actions.textPresent('Add to Cart'));
      check('textPresent is case-insensitive', OB.actions.textPresent('add to cart'));
      iconButton.remove();
      check('textPresent stops finding it once removed', !OB.actions.textPresent('Add to Cart'));

      // --- Tree cache --------------------------------------------------------
      // A second read of an unchanged page must not walk again — that repeat
      // walk was 3.6s on Gmail. Identity is the assertion: an equal-but-new
      // object would mean the walk ran.
      const opts = { mode: 'interactive', selector: '#fixture' };
      const firstRead = OB.a11y.buildTree(opts);
      check('an unchanged page is served from cache', OB.a11y.buildTree(opts) === firstRead);

      // Scope is part of the identity of a tree. Serving one scope's nodes for
      // another would be the worst possible cache bug: plausible, and wrong.
      check('a different scope is not served the cached tree',
        OB.a11y.buildTree({ mode: 'interactive', selector: '#signup' }) !== firstRead);
      check('returning to the first scope still reflects it',
        OB.a11y.buildTree(opts).nodes.length === firstRead.nodes.length);

      // Synchronous mutate-then-read. The observer's callback is a microtask,
      // so without draining its queue this call would be served the tree from
      // before the change — invisibly, and only under this timing.
      const canary = document.createElement('button');
      canary.textContent = 'Cache canary';
      document.querySelector('#fixture main').appendChild(canary);
      const afterMutation = OB.a11y.buildTree(opts);
      check('a same-tick DOM mutation invalidates the cache', afterMutation !== firstRead);
      check('the mutation is actually in the new tree',
        fmt.renderTree(afterMutation.nodes).text.includes('Cache canary'));
      canary.remove();

      // The subtle one. `input.value` is a live property: typing reflects to no
      // attribute and queues no mutation record, so an observer-only cache
      // would keep reporting the old value forever.
      const cachedBeforeTyping = OB.a11y.buildTree(opts);
      const emailField = document.getElementById('email');
      emailField.value = 'dylan@example.com';
      emailField.dispatchEvent(new InputEvent('input', { bubbles: true }));
      const afterTyping = OB.a11y.buildTree(opts);
      check('typing invalidates the cache despite mutating no attribute',
        afterTyping !== cachedBeforeTyping);
      check('the typed value is visible in the fresh tree',
        fmt.renderTree(afterTyping.nodes).text.includes('dylan@example.com'));
      emailField.value = '';
      emailField.dispatchEvent(new InputEvent('input', { bubbles: true }));

      // Focus, which no listener can catch. Chrome updates activeElement at
      // once but withholds focus/focusin until the document has system focus —
      // so in a background tab, the case parallel agent work makes normal, a
      // focusin listener never fires. This test runs with the document
      // unfocused precisely so that shortcut cannot pass.
      const cachedBeforeFocus = OB.a11y.buildTree(opts);
      document.getElementById('email').focus();
      check('a focus change invalidates the cache without a focus event',
        OB.a11y.buildTree(opts) !== cachedBeforeFocus);
      check('the fresh tree reports the new focus',
        fmt.renderTree(OB.a11y.buildTree(opts).nodes).text.includes('focused'));
      document.getElementById('email').blur();

      // --- Search ------------------------------------------------------------
      const hits = OB.a11y.findElements('create account button').results;
      check('find ranks the intended element first', hits[0]?.name === 'Create account', hits[0]?.name);
      check('find returns positions', typeof hits[0]?.rect?.x === 'number');
      const emailHits = OB.a11y.findElements('email').results;
      check('find matches a field by name', emailHits.some((h) => h.name === 'Email address'));

      // Ranking regression, found on Gmail: a long label picking up incidental
      // substring hits used to outrank the short control actually being asked
      // for. `e11` here is the long "You are encouraged to create an account…"
      // style link; the real Coupon field must win.
      const longLabel = document.createElement('button');
      longLabel.textContent =
        'Reply to this message to send a note about your account, or click to view the full subject line and body of the coupon thread';
      document.querySelector('#fixture main').appendChild(longLabel);
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      const couponHits = OB.a11y.findElements('coupon code field').results;
      check('short control outranks a long incidental label',
        couponHits[0]?.name === 'Coupon code', couponHits[0]?.name);
      longLabel.remove();

      // Ranking regression, found on Wikipedia: citation links whose only
      // connection to the query is the URL ("search" inside
      // search.worldcat.org/oclc/33163088) used to score as high as a real
      // name match and fill the result slots, pushing real controls off the
      // list. URL hits now score below role/name/value hits.
      const cit = document.createElement('a');
      cit.href = 'https://search.worldcat.org/oclc/33163088';
      cit.textContent = '33163088';
      document.querySelector('#fixture main').appendChild(cit);
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      const citHit = OB.a11y.findElements('search').results.find((h) => h.name === '33163088');
      check('an href-only match scores below a name match', !!citHit && citHit.score < 2, JSON.stringify(citHit));
      const box = document.createElement('button');
      box.textContent = 'Search';
      document.querySelector('#fixture main').appendChild(box);
      OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      const withBox = OB.a11y.findElements('search').results;
      check('a real control outranks an href-only citation link',
        withBox[0]?.name === 'Search', withBox.map((h) => h.name).join(','));
      cit.remove();
      box.remove();

      // --- Geometry ----------------------------------------------------------
      const submit = OB.a11y.resolveRef(refs.find((r) => OB.a11y.resolveRef(r)?.textContent === 'Create account'));
      // Mirror real usage: the router scrolls a target into view before asking
      // for its click point. Skipping that here made the test depend on the
      // window happening to be tall enough.
      await OB.actions.scrollIntoView(submit);
      const point = OB.actions.clickPoint(submit);
      check('click point is computed', point && point.x > 0 && point.y > 0);
      check('click point is unobstructed', point && !point.obstructed);
      check('click point lands on the element', document.elementFromPoint(point.x, point.y) === submit);

      // Off screen must be distinguishable from covered — the fixes differ.
      const offscreen = document.createElement('button');
      offscreen.textContent = 'Far below';
      offscreen.style.cssText = 'position:absolute;top:99999px;left:0';
      document.body.appendChild(offscreen);
      const offPoint = OB.actions.clickPoint(offscreen);
      check('off-screen target is reported as off-screen, not covered',
        offPoint?.offscreen === true && /outside the viewport/.test(offPoint.obstructedBy || ''),
        offPoint?.obstructedBy);
      offscreen.remove();

      // --- Screenshot by selector -------------------------------------------
      // The fix for blind region-cropping: frame a visual element (canvas/svg/
      // img) by CSS selector, so element mode reaches things that have no ref.
      const rs = OB.__handlers.resolveSelector;
      const chart = await rs({ selector: 'svg', scroll: false });
      check('resolveSelector finds a match', chart.found >= 1, JSON.stringify(chart));
      check('largest visible svg wins over a decoy', chart.selector?.includes('chart'), chart.selector);
      const chartEl = document.getElementById('chart');
      check('rect matches the real element box',
        chart.rect && chart.rect.w === Math.round(chartEl.getBoundingClientRect().width) &&
          chart.rect.h === Math.round(chartEl.getBoundingClientRect().height),
        JSON.stringify(chart.rect));

      const img = await rs({ selector: 'img#pic', scroll: false });
      check('resolveSelector frames an <img> by selector', img.found === 1 && img.rect.w === 300, JSON.stringify(img.rect));

      // mode:"element" with nothing named auto-frames the largest graphic across
      // tag types — the chart svg (820x460) beats the img (300x200) and decoy.
      const auto = await rs({ selector: 'canvas, svg, img, video', scroll: false });
      check('auto-target picks the largest graphic across tags', auto.selector?.includes('chart'), auto.selector);
      check('auto-target ignores tiny/hidden graphics', auto.rect.w === 820 && auto.rect.h === 460, JSON.stringify(auto.rect));

      const none = await rs({ selector: '.does-not-exist', scroll: false });
      check('no match reports found:0, not an error', none.found === 0 && !none.error, JSON.stringify(none));

      const hidden = await rs({ selector: '#hiddensvg', scroll: false });
      check('display:none is not a match', hidden.found === 0, JSON.stringify(hidden));

      const bad = await rs({ selector: ':::nope', scroll: false });
      check('an invalid selector is reported, not thrown', /not a valid/.test(bad.error || ''), JSON.stringify(bad));

      // --- Google sign-in parser (googleAccounts) ---------------------------
      // Isolate: the signup fixture's own password/email inputs would otherwise
      // leak into stage detection, since the parser reads the whole document.
      const ga = OB.__handlers.googleAccounts;
      const fixtureEl = document.getElementById('fixture');
      const savedDisplay = fixtureEl.style.display;
      fixtureEl.style.display = 'none';
      const g = document.createElement('div');
      g.style.cssText = 'position:fixed;top:0;left:0;width:400px;background:#fff;z-index:99999';
      document.body.appendChild(g);

      g.innerHTML =
        '<div data-identifier="sam@work.com" role="link"><div>Sam Ray</div><div>sam@work.com</div></div>' +
        '<div data-identifier="dana@home.com" role="link"><div>Dana Lee</div><div>dana@home.com</div></div>';
      let gr = ga();
      check('googleAccounts detects the account chooser', gr.stage === 'chooser', gr.stage);
      check('googleAccounts reads both accounts with click points',
        gr.accounts.length === 2 && gr.accounts.every((a) => a.point && typeof a.point.x === 'number'),
        JSON.stringify(gr.accounts.map((a) => a.email)));
      check('googleAccounts reads email and name', gr.accounts[0].email === 'sam@work.com' && /Sam Ray/.test(gr.accounts[0].name || ''), JSON.stringify(gr.accounts[0]));

      g.innerHTML = '<input type="password" aria-label="Password" />';
      gr = ga();
      check('googleAccounts flags the password screen and offers nothing', gr.stage === 'password' && gr.accounts.length === 0, gr.stage);

      g.innerHTML = '<p>This app wants access to your Google Account</p><button>Allow</button>';
      gr = ga();
      check('googleAccounts flags a real consent screen with an Allow point', gr.stage === 'consent' && !!gr.allow?.point, JSON.stringify({ stage: gr.stage, allow: gr.allow }));

      g.innerHTML = '<button>Allow</button>';
      gr = ga();
      check('a lone Allow button without consent wording is not consent', gr.stage !== 'consent', gr.stage);

      g.remove();
      fixtureEl.style.display = savedDisplay;

      // --- Event-driven settle -----------------------------------------------
      // `settled` replaces a fixed 350ms sleep + 500ms probe after every action.
      // Three verdicts, each timed: nothing happened (fast), something happened
      // and finished (as soon as it is quiet), still happening (at the ceiling).
      await quiesce();
      const t0 = performance.now();
      const idle = await OB.__handlers.settled({ idleMs: 120, quietMs: 60, maxMs: 500 });
      const idleTook = performance.now() - t0;
      check('settled: a page that does not react reports so at the idle window',
        idle.mutated === false && idle.quiet === true && idleTook >= 100 && idleTook < 400,
        `${JSON.stringify(idle)} in ${Math.round(idleTook)}ms`);

      const t1 = performance.now();
      const reacting = OB.__handlers.settled({ idleMs: 300, quietMs: 80, maxMs: 1000 });
      setTimeout(() => {
        const p = document.createElement('p');
        p.textContent = 'reaction';
        document.querySelector('#fixture main').appendChild(p);
        setTimeout(() => p.remove(), 20);
      }, 30);
      const reacted = await reacting;
      const reactTook = performance.now() - t1;
      check('settled: a reaction that finishes resolves once quiet, before the ceiling',
        reacted.mutated === true && reacted.quiet === true && reacted.changes >= 1 && reactTook < 600,
        `${JSON.stringify(reacted)} in ${Math.round(reactTook)}ms`);

      const t2 = performance.now();
      const churning = OB.__handlers.settled({ idleMs: 200, quietMs: 150, maxMs: 400 });
      const churn = setInterval(() => {
        const p = document.createElement('i');
        document.querySelector('#fixture main').appendChild(p);
        p.remove();
      }, 40);
      const churned = await churning;
      clearInterval(churn);
      const churnTook = performance.now() - t2;
      check('settled: a page still changing reports quiet:false at the ceiling',
        churned.mutated === true && churned.quiet === false && churnTook >= 350 && churnTook < 800,
        `${JSON.stringify(churned)} in ${Math.round(churnTook)}ms`);

      // Our own decoration must not read as a reaction, or every click with a
      // travelling cursor would report "the page is still changing".
      await quiesce();
      const decorated = OB.__handlers.settled({ idleMs: 150, quietMs: 60, maxMs: 500 });
      setTimeout(() => OB.actions.highlight(document.getElementById('email'), 'click'), 20);
      const deco = await decorated;
      check('settled: the tool\'s own highlight is not a reaction', deco.mutated === false, JSON.stringify(deco));

      // Typing reflects to no attribute, so it queues no mutation record — but
      // it is the reaction a browser_input call is waiting for.
      const typing = OB.__handlers.settled({ idleMs: 300, quietMs: 60, maxMs: 800 });
      setTimeout(() => {
        const f = document.getElementById('email');
        f.value = 'typed';
        f.dispatchEvent(new InputEvent('input', { bubbles: true }));
      }, 30);
      const typed = await typing;
      check('settled: typed input counts as a reaction', typed.mutated === true && typed.quiet === true, JSON.stringify(typed));
      document.getElementById('email').value = '';

      // --- Instant conditions (batch when/unless/repeat) ----------------------
      const chk = OB.__handlers.check;
      check('check text: present', chk({ for: 'text', value: 'Create your account' }).ok === true);
      check('check text: absent', chk({ for: 'text', value: 'zebra crossing' }).ok === false);
      check('check no_text inverts', chk({ for: 'no_text', value: 'zebra crossing' }).ok === true);
      check('check selector: visible match', chk({ for: 'selector', value: '#signup button[type=submit]' }).ok === true);
      check('check selector: hidden match does not count', chk({ for: 'selector', value: '#adv input' }).ok === false);
      check('check no_selector', chk({ for: 'no_selector', value: '.does-not-exist' }).ok === true);
      check('check url substring', chk({ for: 'url', value: 'a11y-browser' }).ok === true);
      check('check url regex', chk({ for: 'url', value: '/a11y-BROWSER\\.html$/i' }).ok === true);
      check('check ref_gone on a live ref is false', chk({ for: 'ref_gone', value: refs[0] }).ok === false);
      check('check load', chk({ for: 'load' }).ok === true);
      check('check unknown kind is an error, not false', /unknown/.test(chk({ for: 'nope' }).error || ''));
      check('check never throws on a bad selector', chk({ for: 'selector', value: ':::bad' }).ok === false);

      // --- Outline -------------------------------------------------------------
      // Landmarks carry a selector so mode:"outline" can hand the model something
      // to scope by; headings and lists do not, or an article would list hundreds.
      const outlineTree = OB.a11y.buildTree({ mode: 'interactive', selector: '#fixture' });
      const flatNodes = [];
      (function flat(list) { for (const n of list) { flatNodes.push(n); if (n.children?.length) flat(n.children); } })(outlineTree.nodes);
      const navNode = flatNodes.find((n) => n.role === 'navigation');
      const formNode = flatNodes.find((n) => n.role === 'form');
      check('landmarks carry a selector', typeof navNode?.sel === 'string' && typeof formNode?.sel === 'string', JSON.stringify({ nav: navNode?.sel, form: formNode?.sel }));
      check('the landmark selector resolves to the landmark', document.querySelector(formNode?.sel || 'x')?.id === 'signup', formNode?.sel);
      check('headings carry no selector', flatNodes.filter((n) => n.role === 'heading').every((n) => !n.sel));
      check('controls carry no selector', flatNodes.filter((n) => n.ref).every((n) => !n.sel));
      const outline = fmt.renderOutline(outlineTree.nodes);
      check('outline names the navigation with its link count', /navigation "Main" \(2 links\) selector:"[^"]+"/.test(outline.text), outline.text);
      check('outline lists the form with its control counts', /form \([^)]*textbox[^)]*\) selector:"#signup"/.test(outline.text), outline.text);
      check('outline keeps headings for orientation', /h1 "Create your account"/.test(outline.text));
      check('outline has no refs', !/\[e\d+\]/.test(outline.text));
      check('outline counts every control', outline.refCount === refs.length, `${outline.refCount} vs ${refs.length}`);
      check('outline is much smaller than the tree', outline.text.length < text.length / 2, `${outline.text.length} vs ${text.length}`);

      // --- Token cost --------------------------------------------------------
      const domBytes = document.getElementById('fixture').innerHTML.length;
      const ratio = (domBytes / text.length).toFixed(1);
      check('tree is far smaller than the DOM', domBytes / text.length > 2, `${ratio}x`);

      document.getElementById('results').innerHTML =
        `<h3>${pass} passed, ${fail} failed</h3>` +
        out.join('') +
        `<p>tree ${text.length} chars vs DOM ${domBytes} chars (${ratio}x smaller)</p>` +
        `<pre>${escapeHtml(text)}</pre>`;

      window.__results = { pass, fail, text, failures: out.filter((o) => o.includes('FAIL')) };
    </script>
  </body>
</html>
